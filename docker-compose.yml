version: "3.9"

services:
  rag-chatbot:
    image: rag-chatbot:latest
    container_name: rag-chatbot
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Übergabe von Build-Argumenten aus .env
        START_SCRIPT: ${START_SCRIPT}
    tty: true
    environment:
      - START_SCRIPT=${START_SCRIPT}
      - PYTHONPATH=/app/src
      - WEBUI_API_KEY=#top-secret#
    ports:
      - "${HOST_PORT}:7860"
    volumes:
      - ./:/app/src